<!doctype html>
<html lang="ja">
<head>

  <meta name="theme-color" content="#14245c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./assets/normal-quiz-icon-512.png">
  <link rel="manifest" href="./normal-quiz.webmanifest">
  <title>AI用語クイズ</title>
</head>
<body>
  <p>AI用語クイズを開いています…</p>
  <script>
    const openQuiz = () => window.location.replace('./stage-journey-preview.html?view=normal&pwa=1');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./normal-quiz-service-worker.js').finally(openQuiz);
    } else {
      openQuiz();
    }
  </script>
</body>
