<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI用語クイズ｜キャラクター・画面構成案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0c1c43; color: #fff; font-family: "BIZ UDPGothic", "BIZ UDPゴシック", sans-serif; }
    .board { width: 1800px; height: 1300px; padding: 37px 56px; background: radial-gradient(circle at 70% 0%, #335d9f 0, #142d64 36%, #091731 85%); overflow: hidden; }
    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 35px; margin-bottom: 23px; }
    .kicker { margin: 0 0 9px; color: #7de4ee; font-size: 17px; font-weight: 900; letter-spacing: .2em; }
    h1 { margin: 0; font-size: 43px; letter-spacing: -.04em; }
    .subtitle { margin: 0 0 5px; color: #e9f4ff; font-size: 16px; line-height: 1.5; }
    .hero { position: relative; height: 250px; overflow: hidden; border: 3px solid #b7e9f8; border-radius: 18px; box-shadow: 0 14px 30px #0005; }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 43%; }
    .hero::after { content: ""; position: absolute; inset: 52% 0 0; background: linear-gradient(transparent, #091731ba); }
    .hero-caption { position: absolute; z-index: 1; right: 20px; bottom: 15px; padding: 7px 13px; border-radius: 20px; background: #0e2a67c9; font-size: 15px; font-weight: 900; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 16px; }
    .section-head h2 { margin: 0; font-size: 25px; }
    .section-head p { margin: 0; color: #bdd0ec; font-size: 14px; }
    .screens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
    .screen-card { min-width: 0; padding: 12px; border: 2px solid #5f8dc1; border-radius: 21px; background: #d7eafa; box-shadow: 0 9px 0 #07112a; color: #20366c; }
    .screen-label { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 11px; font-size: 17px; font-weight: 900; }
    .screen-label span { font-size: 11px; color: #426693; }
    iframe { display: block; width: 100%; height: 680px; border: 0; border-radius: 12px; background: #fff; pointer-events: none; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 25px; font-size: 14px; color: #d3e8fc; }
    .route { display: flex; gap: 11px; align-items: center; font-weight: 900; }
    .route span { padding: 9px 13px; border: 1px solid #7eb3e1; border-radius: 999px; background: #ffffff16; }
    .route b { color: #ffc965; }
  </style>
</head>
<body>
  <div class="board">
    <header class="top">
      <div><p class="kicker">CHARACTER &amp; SCREEN COMPOSITION</p><h1>AI用語クイズ｜世界観と画面構成</h1></div>
      <p class="subtitle">承認済みのキャラクター画像をそのまま使用。<br>ホーム → 授業 → 大会 → 進路を、1枚で確認できます。</p>
    </header>
    <div class="hero"><img src="assets/approved-ensemble.png" alt="承認済みのキャラクター集合画像"><div class="hero-caption">承認済みキャラクター原画</div></div>
    <div class="section-head"><h2>4つの主要画面</h2><p>静的デザイン案｜ゲームの進行・音声回答・保存機能は未実装</p></div>
    <div class="screens">
      <section class="screen-card"><div class="screen-label">01 ホーム <span>次のクエストへ</span></div><iframe title="ホーム画面" src="quiz-game-preview.html#home"></iframe></section>
      <section class="screen-card"><div class="screen-label">02 授業 <span>用語を覚える</span></div><iframe title="授業画面" src="quiz-game-preview.html#quiz"></iframe></section>
      <section class="screen-card"><div class="screen-label">03 大会 <span>知識で挑む</span></div><iframe title="大会画面" src="quiz-game-preview.html#battle"></iframe></section>
      <section class="screen-card"><div class="screen-label">04 進路 <span>仲間と成長</span></div><iframe title="進路画面" src="quiz-game-preview.html#journey"></iframe></section>
    </div>
    <footer class="footer"><div class="route"><span>学校</span><b>→</b><span>大学</span><b>→</b><span>社会</span><b>→</b><span>研究</span><b>→</b><span>AI仙人</span></div><div>キャラクター・画面デザイン確認用</div></footer>
  </div>
</body>
</html>
